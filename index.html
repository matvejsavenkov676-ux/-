  function collides(x, z, radius) {
    for (const w of state.walls) {
      if (Math.abs(x - w.x) < w.w / 2 + radius &&
          Math.abs(z - w.z) < w.d / 2 + radius) return true;
    }
    return false;
  }

  function hasLineOfSight(x1, z1, x2, z2) {
    const dx = x2 - x1, dz = z2 - z1;
    const dist = Math.hypot(dx, dz);
    const steps = Math.ceil(dist / 0.5);
    for (let i = 1; i < steps; i++) {
      const t = i / steps;
      const x = x1 + dx * t;
      const z = z1 + dz * t;
      for (const w of state.walls) {
        if (Math.abs(x - w.x) < w.w / 2 && Math.abs(z - w.z) < w.d / 2) return false;
      }
    }
    return true;
  }

  function createBot(x, z, team, hpBonus) {
    const hp = BOT_BASE_HP + (hpBonus || 0);
    const bot = {

    mesh.add(gun);

    const hpGroup = new THREE.Group();
    const barBg = new THREE.Mesh(
      new THREE.PlaneGeometry(1.2, 0.14),

    );
    hpGroup.add(barBg);

      new THREE.PlaneGeometry(1.2, 0.14),

    // Name tag

      new THREE.PlaneGeometry(2.4, 0.6),
      new THREE.MeshBasicMaterial({ map: nameTex, transparent: true, side: THREE.DoubleSide })

    bot.mesh = mesh;
    bot.hpGroup = hpGroup;

  function spawnEnemies(count, team, spawnPoint, radius, hpBonus) {
    for (let i = 0; i < count; i++) {
      let x, z, tries = 0;
      do {
        const a = (i / count) * Math.PI * 2 + Math.random() * 0.6;
        const r = radius * (0.4 + Math.random() * 0.6);
        x = spawnPoint.x + Math.cos(a) * r;
        z = spawnPoint.z + Math.sin(a) * r;
        tries++;
      } while (collides(x, z, BOT_RADIUS) && tries < 40);
      createBot(x, z, team, hpBonus);
    }
  }

  function spawnFFA() {
    const map = MAPS[state.mapIndex];
    const spawns = map.ffaSpawns.slice();
    // Player takes first spawn
    const p = state.player;
    p.x = spawns[0].x;
    p.z = spawns[0].z;
    p.yaw = 0;
    p.pitch = 0;
    // Other 9 bots
    for (let i = 1; i < spawns.length; i++) {
      const bot = createBot(spawns[i].x, spawns[i].z, 'ffa_' + i, 0);
      bot.team = 'ffa';
      bot.name = 'БОЕЦ ' + i;
      bot.mesh.material.color.setHex(0xaa44aa);
      bot.mesh.children[0].material.color.setHex(0xcc66cc);
      // Random FFA colors
      const hue = (i * 40) % 360;
      bot.color = new THREE.Color().setHSL(hue / 360, 0.7, 0.5);
      bot.mesh.material.color.copy(bot.color);
      bot.hpGroup.children[1].material.color.copy(bot.color);
    }
  }

  // === Joystick ===
  const input = { move: { x: 0, y: 0 } };
  const STICK_MAX = 50;

  (function bindStick(el, knob) {
    let active = false, touchId = null, baseX = 0, baseY = 0;
    el.addEventListener('touchstart', e => {
      e.preventDefault(); e.stopPropagation();
      const t = e.changedTouches[0];
      touchId = t.identifier; active = true;
      const r = el.getBoundingClientRect();
      baseX = r.left + r.width / 2;
      baseY = r.top + r.height / 2;
      update(t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener('touchmove', e => {
      if (!active) return;
      for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
          e.preventDefault(); e.stopPropagation();
          update(t.clientX, t.clientY);
        }
      }
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) {
        if (t.identifier === touchId) {
          active = false; touchId = null;
          knob.style.transform = 'translate(-50%,-50%)';
          input.move.x = 0; input.move.y = 0;
        }
      }
    };
    el.addEventListener('touchend', end, { passive: false });
    el.addEventListener('touchcancel', end, { passive: false });
    function update(cx, cy) {
      let dx = cx - baseX, dy = cy - baseY;
      const len = Math.hypot(dx, dy);
      if (len > STICK_MAX) { dx *= STICK_MAX / len; dy *= STICK_MAX / len; }
      knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      input.move.x = dx / STICK_MAX;
      input.move.y = dy / STICK_MAX;
    }
  })(stickL, knobL);

  // Swipe look
  let lookTouch = null, lookLastX = 0, lookLastY = 0;
  function isOnUI(target) {
    let el = target;
    while (el && el !== document.body) {
      if (el.id === 'stickL' || el.id === 'fireBtn' || el.id === 'reloadBtn' ||
          el.id === 'menuBtn' || el.id === 'topBar' || el.id === 'scoreboard') return true;
      el = el.parentElement;
    }
    return false;
  }
  document.addEventListener('touchstart', e => {
    if (!state.running || state.paused) return;
    for (const t of e.changedTouches) {
      if (isOnUI(t.target)) continue;
      if (lookTouch === null) {
        lookTouch = t.identifier;
        lookLastX = t.clientX; lookLastY = t.clientY;
        break;
      }
    }
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!state.running || state.paused || lookTouch === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouch) {
        e.preventDefault();
        const dx = t.clientX - lookLastX;
        const dy = t.clientY - lookLastY;
        lookLastX = t.clientX; lookLastY = t.clientY;
        const sens = state.sensitivity * 0.0012;
        state.player.yaw -= dx * sens;
        state.player.pitch -= dy * sens;
        state.player.pitch = Math.max(-1.2, Math.min(1.2, state.player.pitch));
      }
    }
  }, { passive: false });
  const endLook = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookTouch) lookTouch = null;
    }
  };
  document.addEventListener('touchend', endLook, { passive: false });

  // Desktop

  function startRound() {
    const map = MAPS[state.mapIndex];
    const p = state.player;
    p.x = map.playerSpawn.x;
    p.z = map.playerSpawn.z;
    p.yaw = map.playerSpawn.yaw;
    p.pitch = 0;
    p.hp = MAX_HP;
    p.ammo = MAX_AMMO;
    p.reloading = false;
    p.fireCooldown = 0;
    p.hitFlash = 0;
    state.bullets.forEach(b => scene.remove(b.mesh));
    state.bullets = [];

    // Clear old bots
    for (const bot of state.bots) {
      scene.remove(bot.mesh);
      scene.remove(bot.hpGroup);
    }
    state.bots = [];

    if (state.mode === 'ffa') {
      spawnFFA();
    } else {
      // Team mode: allies + enemies
      const hpBonus = (state.round - 1) * 25;
      // Allies
      for (let i = 0; i < Math.min(TEAM_ALLY_COUNT, map.allySpawns.length); i++) {
        const sp = map.allySpawns[i];
        createBot(sp.x, sp.z, 'blue', hpBonus);
      }
      // Enemies
      const enemyCount = Math.min(2 + state.round, 8);
      spawnEnemies(enemyCount, 'red', map.enemyTeamSpawn, 3.5, hpBonus);
    }

    state.phase = 'prep';
    state.prepTimer = PREP_TIME;
    updateHud();
    updateScoreboard();
    showBanner(
      state.mode === 'ffa' ? 'FFA — ' + state.round : 'РАУНД ' + state.round,
      'ПОДГОТОВКА: ' + PREP_TIME.toFixed(1)

  function countTeam(team) {

  function updateHud() {

    for (const b of sorted) {
      const cls = b.team === 'blue' ? 'blue' : b.team === 'red' ? 'red' : 'green';

  function spawnParticles(x, y, z, color) {
    for (let i = 0; i < 8; i++) {
      const p = new THREE.Mesh(
        new THREE.BoxGeometry(0.09, 0.09, 0.09),
        new THREE.MeshBasicMaterial({ color })
      );
      p.position.set(x, y, z);
      const a = Math.random() * Math.PI * 2;
      const b = Math.random() * Math.PI;
      const sp = 2 + Math.random() * 3;
      p.userData = {
        vx: Math.cos(a) * Math.sin(b) * sp,
        vy: Math.abs(Math.cos(b)) * sp,
        vz: Math.sin(a) * Math.sin(b) * sp,
        life: 0.5
      };
      scene.add(p);
      state.particles.push(p);
    }
  }

  function updateParticles(dt) {
    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.userData.vy -= 14 * dt;
      p.position.x += p.userData.vx * dt;
      p.position.y += p.userData.vy * dt;
      p.position.z += p.userData.vz * dt;
      p.userData.life -= dt;
      p.scale.setScalar(Math.max(0.01, p.userData.life * 2));
      if (p.userData.life <= 0 || p.position.y < -1) {
        scene.remove(p);
        state.particles.splice(i, 1);
      }
    }
  }

  function startReload() {
    const p = state.player;
    if (p.reloading || p.ammo >= MAX_AMMO) return;
    p.reloading = true;
    p.reloadTimer = RELOAD_TIME;
    updateHud();
  }

  function fireBullet(owner, x, y, z, angle, yaw, speed, damage, color, ownerBot) {
    const cos = Math.cos(angle);
    const vx = Math.sin(yaw) * cos * speed;
    const vy = Math.sin(angle) * speed;
    const vz = Math.cos(yaw) * cos * speed;
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 6, 6),
      new THREE.MeshBasicMaterial({ color })
    );
    mesh.position.set(x, y, z);
    scene.add(mesh);
    state.bullets.push({
      mesh, x, y, z, vx, vy, vz,
      damage, owner, ownerBot,
      life: 2.0, traveled: 0, maxRange: 60
    });
  }

  function tryShoot() {
    const p = state.player;
    if (p.reloading || p.ammo <= 0 || p.fireCooldown > 0) return;
    p.fireCooldown = 0.11;
    p.ammo--;
    updateHud();

    const flash = weaponGroup.getObjectByName('flash');
    if (flash) {
      flash.material.opacity = 1;
      setTimeout(() => flash.material.opacity = 0, 45);
    }

    const cosP = Math.cos(p.pitch);
    const dx = -Math.sin(p.yaw) * cosP;
    const dy = Math.sin(p.pitch);
    const dz = -Math.cos(p.yaw) * cosP;
    const origin = new THREE.Vector3(p.x, PLAYER_HEIGHT, p.z);
    const dir = new THREE.Vector3(dx, dy, dz).normalize();
    const ray = new THREE.Raycaster(origin, dir, 0.1, 80);

    const targets = wallMeshes.slice();
    for (const bot of state.bots) {
      if (!bot.alive) continue;
      targets.push(bot.mesh);
      for (const c of bot.mesh.children) targets.push(c);
    }

    const hits = ray.intersectObjects(targets, false);
    if (hits.length > 0) {
      const hit = hits[0];
      let hitBot = null;
      for (const b of state.bots) {
        if (!b.alive) continue;
        if (hit.object === b.mesh || hit.object.parent === b.mesh) { hitBot = b; break; }
      }
      if (hitBot) {
        if (state.mode === 'team' && hitBot.team === 'blue') {
          // Friendly fire ignored
        } else {
          hitBot.hp -= 34;
          hitBot.hitFlash = 0.1;
          spawnParticles(hit.point.x, hit.point.y, hit.point.z, 0xff4444);
          showHitmark();
          if (hitBot.hp <= 0) killBot(hitBot, 'Вы');
        }
      } else {
        spawnParticles(hit.point.x, hit.point.y, hit.point.z, 0xaabbee);
      }
    }

    if (p.ammo <= 0) startReload();
  }

  function killBot(bot, killerName) {
    bot.alive = false;
    bot.hp = 0;
    spawnParticles(bot.x, 0.8, bot.z, 0xff4466);
    scene.remove(bot.mesh);
    scene.remove(bot.hpGroup);
    if (killerName === 'Вы') {
      state.kills++;
      addKillFeed('Вы убили ' + bot.name);
    } else {
      addKillFeed(killerName + ' убил ' + bot.name);
    }
    updateHud();
    updateScoreboard();

    if (state.mode === 'team') {
      const enemiesLeft = state.bots.filter(b => b.alive && b.team === 'red').length;
      const alliesLeft = state.bots.filter(b => b.alive && b.team === 'blue').length + 1;
      if (enemiesLeft === 0 && state.phase === 'fight') {
        state.phase = 'transition';
        state.round++;
        showBanner('РАУНД ' + state.round, 'ЗАГРУЗКА...');
        setTimeout(() => {
          if (!state.running) return;
          startRound();
        }, 1500);
      } else if (alliesLeft === 0 && state.player.hp <= 0) {
        // handled by player death
      }
    } else {
      // FFA: check if only player remains
      const aliveBots = state.bots.filter(b => b.alive).length;
      if (aliveBots === 0) {
        endGame(true);
      }
    }
  }

  function damagePlayer(amount, attackerName) {
    const p = state.player;
    p.hp -= amount;
    p.hitFlash = 0.15;
    showDamageFlash();
    updateHud();
    if (p.hp <= 0) {
      p.hp = 0;
      updateHud();
      addKillFeed(attackerName + ' убил ВАС');
      endGame(false);
    }
  }

  function update(dt) {
    if (!state.running || state.paused) return;
    const p = state.player;

    if (mouseDX || mouseDY) {
      const sens = state.sensitivity * 0.0008;
      p.yaw -= mouseDX * sens;
      p.pitch -= mouseDY * sens;
      p.pitch = Math.max(-1.2, Math.min(1.2, p.pitch));
      mouseDX = 0; mouseDY = 0;
    }

    if (state.phase === 'prep') {
      state.prepTimer -= dt;
      if (state.prepTimer > 0) {
        bannerSmall.textContent = 'ПОДГОТОВКА: ' + Math.max(0, state.prepTimer).toFixed(1);
      } else {
        state.phase = 'fight';
        hideBanner();
      }
    }

    // Movement only during fight
    if (state.phase === 'fight') {
      let mx = input.move.x, my = input.move.y;
      if (keys['w'] || keys['ц']) my -= 1;
      if (keys['s'] || keys['ы']) my += 1;
      if (keys['a'] || keys['ф']) mx -= 1;
      if (keys['d'] || keys['в']) mx += 1;
      const mlen = Math.hypot(mx, my);
      if (mlen > 1) { mx /= mlen; my /= mlen; }

      const forwardX = -Math.sin(p.yaw);
      const forwardZ = -Math.cos(p.yaw);
      const rightX = Math.cos(p.yaw);
      const rightZ = -Math.sin(p.yaw);

      const dx = (forwardX * -my + rightX * mx) * PLAYER_SPEED * dt;
      const dz = (forwardZ * -my + rightZ * mx) * PLAYER_SPEED * dt;

      const nx = p.x + dx;
      const nz = p.z + dz;
      if (!collides(nx, p.z, PLAYER_RADIUS)) p.x = nx;
      if (!collides(p.x, nz, PLAYER_RADIUS)) p.z = nz;
    }

    p.fireCooldown = Math.max(0, p.fireCooldown - dt);
    if (state.phase === 'fight' && (firing || mouseDown || keys[' '])) tryShoot();

    if (p.reloading) {
      p.reloadTimer -= dt;
      if (p.reloadTimer <= 0) {
        p.reloading = false;
        p.ammo = MAX_AMMO;
        updateHud();
      }
    }
    if (p.hitFlash > 0) p.hitFlash -= dt;

    // === Bot AI ===
    if (state.phase === 'fight') {
      for (const bot of state.bots) {
        if (!bot.alive) continue;

        // Find target
        let bestTarget = null;
        let bestDist = Infinity;
        const potentialTargets = [];

        if (state.mode === 'ffa') {
          // FFA: everyone is target
          potentialTargets.push({ type: 'player', x: p.x, z: p.z, hp: p.hp });
          for (const other of state.bots) {
            if (other === bot || !other.alive) continue;
            potentialTargets.push({ type: 'bot', bot: other, x: other.x, z: other.z, hp: other.hp });
          }
        } else {
          // Team mode
          if (bot.team === 'red') {
            potentialTargets.push({ type: 'player', x: p.x, z: p.z, hp: p.hp });
            for (const other of state.bots) {
              if (other === bot || !other.alive || other.team !== 'blue') continue;
              potentialTargets.push({ type: 'bot', bot: other, x: other.x, z: other.z, hp: other.hp });
            }
          } else {
            // blue ally targets red
            for (const other of state.bots) {
              if (other === bot || !other.alive || other.team !== 'red') continue;
              potentialTargets.push({ type: 'bot', bot: other, x: other.x, z: other.z, hp: other.hp });
            }
          }
        }

        for (const t of potentialTargets) {
          const d = Math.hypot(t.x - bot.x, t.z - bot.z);
          if (d < bestDist && hasLineOfSight(bot.x, bot.z, t.x, t.z)) {
            bestDist = d;
            bestTarget = t;
          }
        }

        if (bestTarget) {
          bot.lastSeen = { x: bestTarget.x, z: bestTarget.z };
          bot.targetLostTimer = 3.0;
        } else if (bot.targetLostTimer > 0) {
          bot.targetLostTimer -= dt;
        }

        const moveTarget = bestTarget || (bot.targetLostTimer > 0 && bot.lastSeen ? { x: bot.lastSeen.x, z: bot.lastSeen.z } : null);

        if (moveTarget) {
          const dx = moveTarget.x - bot.x;
          const dz = moveTarget.z - bot.z;
          const dist = Math.hypot(dx, dz) || 0.001;
          const angleToTarget = Math.atan2(dx, dz);

          // Rotate smoothly
          let diff = angleToTarget - bot.angle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          bot.angle += diff * Math.min(1, dt * 10);

          // Movement: keep at preferred distance
          const preferredDist = 10;
          let mx = 0, mz = 0;
          if (dist > preferredDist + 2) {
            mx = dx / dist;
            mz = dz / dist;
          } else if (dist < preferredDist - 3) {
            mx = -dx / dist;
            mz = -dz / dist;
          }

          // Strafe to be harder to hit
          const strafe = Math.sin(performance.now() * 0.002 + bot.x) * 0.6;
          mx += Math.cos(angleToTarget) * strafe;
          mz -= Math.sin(angleToTarget) * strafe;

          // Avoid crowding other bots
          for (const other of state.bots) {
            if (other === bot || !other.alive) continue;
            const od = Math.hypot(other.x - bot.x, other.z - bot.z);
            if (od < BOT_RADIUS * 3 && od > 0.01) {
              const push = (BOT_RADIUS * 3 - od) / (BOT_RADIUS * 3);
              mx -= (other.x - bot.x) / od * push * 0.8;
              mz -= (other.z - bot.z) / od * push * 0.8;
            }
          }

          const mlen = Math.hypot(mx, mz);
          if (mlen > 1) { mx /= mlen; mz /= mlen; }

          const speed = BOT_SPEED * (bot.hp < bot.maxHp * 0.3 ? 0.7 : 1.0);
          const nx = bot.x + mx * speed * dt;
          const nz = bot.z + mz * speed * dt;
          if (!collides(nx, bot.z, BOT_RADIUS)) bot.x = nx;
          if (!collides(bot.x, nz, BOT_RADIUS)) bot.z = nz;

          // Shoot
          if (bestTarget && dist < BOT_VIEW_DIST) {
            bot.shootTimer -= dt;
            if (bot.shootTimer <= 0) {
              bot.shootTimer = BOT_SHOOT_INTERVAL + Math.random() * 0.4;
              const accuracy = BOT_ACCURACY * (1 + dist / 30);
              const spread = (Math.random() - 0.5) * accuracy * 2;
              const a = angleToTarget + spread;
              const ox = bot.x + Math.sin(a) * 0.7;
              const oz = bot.z + Math.cos(a) * 0.7;
              fireBullet('bot', ox, 1.2, oz, 0, a, 30, BOT_DAMAGE, 0xff5555, bot);
            }
          }
        }

        if (bot.hitFlash > 0) {
          bot.hitFlash -= dt;
          bot.mesh.material.emissive = new THREE.Color(0xffffff);
          bot.mesh.material.emissiveIntensity = 0.6;
        } else {
          bot.mesh.material.emissive = new THREE.Color(0x000000);
        }

        bot.mesh.position.x = bot.x;
        bot.mesh.position.z = bot.z;
        bot.mesh.rotation.y = bot.angle;

        bot.hpGroup.position.set(bot.x, 2.2, bot.z);
        bot.hpGroup.lookAt(camera.position);
        const fill = bot.hpGroup.getObjectByName('hpFill');
        if (fill) {
          const pct = Math.max(0, bot.hp / bot.maxHp);
          fill.scale.x = pct;
          fill.position.x = -(1 - pct) * 0.6;
        }
      }
    }

    // Bullets
    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const b = state.bullets[i];
      const nx = b.x + b.vx * dt;
      const ny = b.y + b.vy * dt;
      const nz = b.z + b.vz * dt;
      const stepLen = Math.hypot(nx - b.x, ny - b.y, nz - b.z);
      b.traveled += stepLen;
      b.x = nx; b.y = ny; b.z = nz;
      b.life -= dt;
      b.mesh.position.set(b.x, b.y, b.z);

      if (b.life <= 0 || b.traveled > b.maxRange) {
        scene.remove(b.mesh); state.bullets.splice(i, 1); continue;
      }

      // Wall
      let hitWall = false;
      for (const w of state.walls) {
        if (Math.abs(b.x - w.x) < w.w / 2 + 0.1 && Math.abs(b.z - w.z) < w.d / 2 + 0.1 && b.y < 3) {
          hitWall = true; break;
        }
      }
      if (hitWall) {
        spawnParticles(b.x, b.y, b.z, 0xaabbee);
        scene.remove(b.mesh); state.bullets.splice(i, 1); continue;
      }

      // Player hit
      if (b.owner === 'bot') {
        if (Math.abs(b.x - state.player.x) < PLAYER_RADIUS + 0.2 &&
            Math.abs(b.z - state.player.z) < PLAYER_RADIUS + 0.2 &&
            b.y > 0.5 && b.y < 2.2) {
          damagePlayer(b.damage, b.ownerBot ? b.ownerBot.name : 'Враг');
          spawnParticles(b.x, b.y, b.z, 0x44aaff);
          scene.remove(b.mesh); state.bullets.splice(i, 1); continue;
        }
      } else {
        // Player bullet hits bot
        for (const bot of state.bots) {
          if (!bot.alive) continue;
          if (b.ownerBot === bot) continue;
          if (Math.abs(b.x - bot.x) < BOT_RADIUS + 0.2 &&
              Math.abs(b.z - bot.z) < BOT_RADIUS + 0.2 &&
              b.y > 0.5 && b.y < 2.2) {
            if (state.mode === 'team' && bot.team === 'blue') continue;
            bot.hp -= b.damage;
            bot.hitFlash = 0.12;
            spawnParticles(b.x, b.y, b.z, 0xff5555);
            if (bot.hp <= 0) killBot(bot, 'Вы');
            scene.remove(b.mesh); state.bullets.splice(i, 1);
            break;
          }
        }
        // Player bullet hits enemy bot bullet? no
      }

      // Bot vs bot (FFA) or bot bullet hits other bot (team)
      if (state.bullets[i] === b && b.ownerBot) {
        for (const other of state.bots) {
          if (!other.alive || other === b.ownerBot) continue;
          if (state.mode === 'team' && other.team === b.ownerBot.team) continue;
          if (Math.abs(b.x - other.x) < BOT_RADIUS + 0.2 &&
              Math.abs(b.z - other.z) < BOT_RADIUS + 0.2 &&
              b.y > 0.5 && b.y < 2.2) {
            other.hp -= b.damage;
            other.hitFlash = 0.12;
            spawnParticles(b.x, b.y, b.z, 0xff5555);
            if (other.hp <= 0) killBot(other, b.ownerBot.name);
            scene.remove(b.mesh); state.bullets.splice(i, 1);
            break;
          }
        }
      }
    }

    updateParticles(dt);
    updateScoreboard();

    camera.position.set(p.x, PLAYER_HEIGHT, p.z);
    camera.rotation.y = p.yaw;
    camera.rotation.x = p.pitch;
  }

  function loop(t) {
    const dt = Math.min(0.05, (t - state.lastTime) / 1000 || 0);
    state.lastTime = t;
    update(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  document.querySelectorAll('.modeBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      startGame(btn.dataset.mode, parseInt(btn.dataset.map, 10));
    });
  });

  document.getElementById('menuBtn2').addEventListener('click', () => {
    gameOver.style.display = 'none';
    menu.style.display = 'flex';
    state.running = false;
    stickL.style.display = 'none';
    fireBtn.style.display = 'none';
    reloadBtn.style.display = 'none';
    menuBtn.style.display = 'none';
    scoreboard.style.display = 'none';
  });

  resize();
  requestAnimationFrame(loop);
})();
</script>
